<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Automatización de reportes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1220"/><stop offset="1" stop-color="#14243F"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#FFD27D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#FFD27D" stop-opacity="0.16"/><stop offset="1" stop-color="#FFD27D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFD27D" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <text x="56" y="66" fill="#8AA0C0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">AUTOMATIZACIÓN</text>
  <text x="56" y="128" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Menos trabajo</text>
  <text x="56" y="176" fill="url(#gr)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">manual</text>
  <text x="56" y="222" fill="#93A4C0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Reportes, avisos y datos que</text>
  <text x="56" y="248" fill="#93A4C0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">se mueven solos.</text>
  <rect x="56" y="288" width="150" height="44" rx="22" fill="#22C55E"/>
  <text x="131" y="316" text-anchor="middle" fill="#062012" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Desde S/ 600</text>

  <circle cx="500" cy="150" r="46" fill="#22C55E" fill-opacity="0.14" stroke="#22C55E" stroke-width="2"/>
  <path d="M486 150l10 10 20-22" fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="220" text-anchor="middle" fill="#E7EDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Venta registrada</text>

  <circle cx="660" cy="150" r="46" fill="#FFD27D" fill-opacity="0.14" stroke="#FFD27D" stroke-width="2"/>
  <rect x="644" y="134" width="32" height="38" rx="4" fill="none" stroke="#FFD27D" stroke-width="3"/>
  <path d="M650 144h20M650 152h20M650 160h12" stroke="#FFD27D" stroke-width="3" stroke-linecap="round"/>
  <text x="660" y="220" text-anchor="middle" fill="#E7EDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Reporte generado</text>

  <circle cx="580" cy="340" r="46" fill="#7FB2FF" fill-opacity="0.14" stroke="#7FB2FF" stroke-width="2"/>
  <rect x="562" y="326" width="36" height="26" rx="4" fill="none" stroke="#7FB2FF" stroke-width="3"/>
  <path d="M562 330l18 14 18-14" fill="none" stroke="#7FB2FF" stroke-width="3" stroke-linejoin="round"/>
  <text x="580" y="410" text-anchor="middle" fill="#E7EDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Enviado por correo</text>

  <path d="M546 158 C 580 175, 590 185, 614 158" fill="none" stroke="#3A4C6B" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M614 158l-10-2 4 9z" fill="#3A4C6B"/>
  <path d="M660 196 C 650 240, 630 280, 600 300" fill="none" stroke="#3A4C6B" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M600 300l1-10 9 5z" fill="#3A4C6B"/>
  <rect x="560" y="90" width="80" height="22" rx="11" fill="#15233B"/>
  <text x="600" y="105" text-anchor="middle" fill="#22C55E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="1">AUTOMÁTICO</text>
</svg>
